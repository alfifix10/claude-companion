<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بك — Claude Companion</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main class="wrap">
    <img class="logo" src="icons/icon128.png" alt="Claude Companion">
    <h1>Claude Companion</h1>
    <p class="tag">مساعد المتصفّح الذي يعمل باشتراك Claude Max.</p>

    <!-- One status card. JS flips it between checking / ready / waiting. -->
    <section class="card" id="card" data-state="checking" aria-live="polite">
      <div class="card-icon" id="icon">⏳</div>
      <h2 class="card-title" id="title">جارٍ الفحص…</h2>
      <p class="card-msg" id="msg"></p>
      <button class="recheck" id="recheck" type="button" hidden>↻ إعادة الفحص</button>
    </section>

    <a class="site" href="https://claude-companion.netlify.app/" target="_blank" rel="noopener">claude-companion.netlify.app</a>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
